<title>Route Walk Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone on the left running the real flow; a "behind the scenes" inspector on the right
   that separates what the customer said from what the software inferred and what the engine receives. */
:root {
  --canvas: #F5F3EE;
  --surface: #FFFFFF;
  --ink: #0D2B4D;
  --muted: #5B6B7E;
  --line: #D9DEE4;
  --accent: #1688F8;
  --accent-ink: #FFFFFF;
  --accent-tint: #EAF4FF;
  --inferred: #23664B;
  --inferred-tint: #EAF8F2;
  --review: #8A5A00;
  --review-tint: #FFF4DC;
  --phone-bezel: #0D2B4D;
  --code-bg: #F1F4F8;
  --font-display: "Inter Tight", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0B1A2F; --surface: #142B4C; --ink: #E8EEF6; --muted: #9FB0C6; --line: #2A4268;
    --accent: #4EA3FF; --accent-ink: #06182C; --accent-tint: #173A63; --inferred: #7FD6AE; --inferred-tint: #143B33;
    --review: #F2C46B; --review-tint: #3D3218; --phone-bezel: #050D18; --code-bg: #0F2240; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #0B1A2F; --surface: #142B4C; --ink: #E8EEF6; --muted: #9FB0C6; --line: #2A4268;
  --accent: #4EA3FF; --accent-ink: #06182C; --accent-tint: #173A63; --inferred: #7FD6AE; --inferred-tint: #143B33;
  --review: #F2C46B; --review-tint: #3D3218; --phone-bezel: #050D18; --code-bg: #0F2240; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--canvas); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.page { max-width: 1180px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
header.top h1 { font-family: var(--font-display); font-size: 1.45rem; margin: 0; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); font-size: .9rem; max-width: 60ch; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.examples span { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chip { font: inherit; font-size: .82rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip:hover, .chip:focus-visible { border-color: var(--accent); outline: none; }
.stage { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 880px) { .stage { grid-template-columns: minmax(0, 1fr); } }

/* Phone */
.phone { background: var(--phone-bezel); border-radius: 44px; padding: 12px; box-shadow: 0 24px 60px -30px rgba(13, 43, 77, .55); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.screen { background: var(--canvas); border-radius: 34px; height: min(780px, calc(100vh - 140px)); min-height: 560px; overflow-y: auto; display: flex; flex-direction: column; }
@media (max-width: 880px) {
  .phone { position: static; background: none; padding: 0; box-shadow: none; border-radius: 0; }
  .screen { height: auto; min-height: 0; border-radius: 20px; border: 1px solid var(--line); }
}
.bar { padding: 18px 20px 12px; display: grid; gap: 10px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
.bar-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .78rem; }
.bar-row b { letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.bar-row button { font: inherit; background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px 0; }
.bar-row button:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.progress { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.progress i { height: 4px; border-radius: 4px; background: var(--line); }
.progress i.on { background: var(--accent); }
.handled { margin: 14px 20px 0; padding: 10px 12px; border-radius: 12px; background: var(--inferred-tint); color: var(--inferred); font-size: .84rem; display: flex; gap: 8px; align-items: flex-start; }
.handled svg { flex: none; margin-top: 2px; }
.q { padding: 18px 20px 28px; display: grid; gap: 14px; }
.q h2 { font-family: var(--font-display); font-size: 1.32rem; line-height: 1.25; margin: 0; text-wrap: balance; }
.q .help { margin: -4px 0 0; color: var(--muted); font-size: .9rem; }
.opts { display: grid; gap: 10px; }
.opts.pics { grid-template-columns: 1fr 1fr; }
.opt { font: inherit; text-align: left; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 16px; padding: 14px 16px; cursor: pointer; display: grid; gap: 2px; min-height: 56px; align-content: center; }
.opt:hover { border-color: var(--accent); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-tint); }
.opt b { font-weight: 600; }
.opt small { color: var(--muted); font-size: .8rem; line-height: 1.35; }
.opt .pic { color: var(--ink); display: block; margin-bottom: 6px; }
.opt .pic svg { width: 100%; height: auto; display: block; }
.opt.unsure { background: transparent; border-style: dashed; }
.opts.pics .opt.wide { grid-column: 1 / -1; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button { font: inherit; font-size: .84rem; border: none; border-radius: 10px; padding: 9px 4px; background: none; color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); }
.field { display: grid; gap: 6px; font-weight: 600; font-size: .9rem; }
.field input { font: inherit; font-size: 1.4rem; font-variant-numeric: tabular-nums; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--surface); color: var(--ink); width: 100%; }
.field input:focus { outline: none; border-color: var(--accent); }
.convert { font-size: .85rem; color: var(--inferred); }
.walk { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.walk svg { width: 100%; height: auto; display: block; color: var(--ink); }
.cta { font: inherit; font-weight: 600; border: none; border-radius: 999px; padding: 14px 18px; background: var(--accent); color: var(--accent-ink); cursor: pointer; width: 100%; }
.cta:disabled { opacity: .4; cursor: not-allowed; }
.cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.ghost { font: inherit; font-weight: 600; border: 1.5px solid var(--line); border-radius: 999px; padding: 12px 18px; background: var(--surface); color: var(--ink); cursor: pointer; width: 100%; }
.split { display: grid; gap: 12px; }
.split section { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.split h3 { margin: 0 0 6px; font-size: .75rem; letter-spacing: .07em; text-transform: uppercase; }
.split h3.you { color: var(--accent); }
.split h3.we { color: var(--inferred); }
.split dl { margin: 0; display: grid; gap: 8px; }
.split dt { font-size: .78rem; color: var(--muted); }
.split dd { margin: 0; font-weight: 600; font-size: .9rem; display: flex; justify-content: space-between; gap: 8px; }
.split dd button { font: inherit; font-size: .78rem; font-weight: 500; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; flex: none; }
.split dd small { display: block; font-weight: 400; color: var(--muted); font-size: .78rem; }
.note { font-size: .84rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin: 0; }
.note.warn { background: var(--review-tint); color: var(--ink); border-color: transparent; }
.result { padding: 28px 20px; display: grid; gap: 14px; }
.result h2 { font-family: var(--font-display); font-size: 1.4rem; margin: 0; text-wrap: balance; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; width: fit-content; }
.badge.ok { background: var(--inferred-tint); color: var(--inferred); }
.badge.rev { background: var(--review-tint); color: var(--review); }
.badge.wip { background: var(--accent-tint); color: var(--accent); }

/* Inspector */
.inspector { display: grid; gap: 16px; min-width: 0; }
.inspector > details { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.inspector summary { cursor: pointer; padding: 14px 18px; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.inspector summary::-webkit-details-marker { display: none; }
.inspector .body { padding: 0 18px 18px; display: grid; gap: 16px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 1060px) { .cols { grid-template-columns: 1fr; } }
.col h4 { margin: 0 0 8px; font-size: .75rem; letter-spacing: .07em; text-transform: uppercase; }
.col.you h4 { color: var(--accent); }
.col.we h4 { color: var(--inferred); }
.col ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.col li { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; font-size: .86rem; min-width: 0; }
.col.you li { border-color: var(--accent); }
.col.we li { border-color: var(--inferred); }
.col li span { display: block; color: var(--muted); font-size: .78rem; }
.empty { color: var(--muted); font-size: .86rem; margin: 0; }
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.sum div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.sum b { display: block; font-family: var(--font-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.sum span { font-size: .76rem; color: var(--muted); }
.math { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.keys { overflow-x: auto; }
.keys table { border-collapse: collapse; width: 100%; font-family: var(--font-mono); font-size: .78rem; }
.keys td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.keys td:first-child { color: var(--muted); white-space: nowrap; }
.keys td:last-child { font-weight: 500; overflow-wrap: anywhere; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flags code { font-family: var(--font-mono); font-size: .74rem; background: var(--review-tint); color: var(--review); border-radius: 6px; padding: 3px 7px; }
@media (prefers-reduced-motion: no-preference) { .q, .result { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(6px); } to { transform: none; } } }
</style>

<div class="page">
  <header class="top">
    <div>
      <h1>Route Walk · dedicated circuit intake</h1>
      <p>Isolated prototype. Not connected to the live storefront. The questions, inferences and engine mapping run on the same TypeScript module as the verify script.</p>
    </div>
    <div class="examples" aria-label="Load an example">
      <span>Examples</span>
      <button class="chip" type="button" data-example="tri">Tri-level, attic ($835 case)</button>
      <button class="chip" type="button" data-example="garage">Ranch, garage panel</button>
      <button class="chip" type="button" data-example="twostory">Two-story, goes to review</button>
      <button class="chip" type="button" data-example="fresh">Start fresh</button>
    </div>
  </header>

  <div class="stage">
    <div class="phone"><div class="screen" id="screen" aria-live="polite"></div></div>
    <div class="inspector" id="inspector"></div>
  </div>
</div>

<script>/*__ROUTE_WALK_BUNDLE__*/</script>
<script>
(() => {
  const RW = window.RouteWalk;
  const SECTIONS = ["Your project", "Your home", "The new outlet", "Your panel", "Open spaces", "One measurement", "Check and confirm"];
  const PROGRESS = ["Your project", "Your home", "The new outlet", "Your panel", "One measurement", "Check and confirm"];
  const EXAMPLES = {
    tri: { equipment: "fridge_freezer", shape: "tri-level", below: "basement", basementCeiling: "open", hasGarage: "no", outletPlace: "3", wall: "drywall", panelPlace: "basement", atticOverOutlet: "yes" },
    garage: { equipment: "microwave", shape: "one", below: "slab", hasGarage: "yes", garageSize: "two", outletPlace: "1", wall: "drywall", panelPlace: "garage", garageWall: "far", garageFinished: "no" },
    twostory: { equipment: "fridge_freezer", shape: "two", below: "basement", basementCeiling: "open", hasGarage: "no", outletPlace: "2", wall: "drywall", panelPlace: "basement" },
    fresh: {},
  };
  const DRAFT_EXAMPLES = { tri: { method: "feet", feet: "45", steps: "", estimate: "" } };

  let answers = { ...EXAMPLES.tri };
  let draft = { method: "feet", feet: "45", steps: "", estimate: "" };
  let cursor = null; // a step key being revisited; null = first unanswered
  let lastHandled = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- pictures (simple line drawings the customer can recognise) ----------
  const stroke = 'fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
  const PICS = {
    one: `<svg viewBox="0 0 120 70" aria-hidden="true"><path ${stroke} d="M10 34 60 10l50 24"/><path ${stroke} d="M18 30v32h84V30"/><rect x="52" y="44" width="16" height="18" ${stroke}/></svg>`,
    two: `<svg viewBox="0 0 120 70" aria-hidden="true"><path ${stroke} d="M18 22 60 4l42 18"/><path ${stroke} d="M24 20v44h72V20"/><path ${stroke} d="M24 42h72" opacity=".45"/><rect x="53" y="50" width="14" height="14" ${stroke}/></svg>`,
    three: `<svg viewBox="0 0 120 70" aria-hidden="true"><path ${stroke} d="M26 16 60 2l34 14"/><path ${stroke} d="M30 14v52h60V14"/><path ${stroke} d="M30 31h60M30 48h60" opacity=".45"/><rect x="54" y="54" width="12" height="12" ${stroke}/></svg>`,
    "bi-level": `<svg viewBox="0 0 120 70" aria-hidden="true"><path ${stroke} d="M8 26 60 6l52 20"/><path ${stroke} d="M14 24v40h92V24"/><path ${stroke} d="M14 42h92" opacity=".45"/><path ${stroke} d="M52 46h16v18H52z"/><path ${stroke} d="M44 46l8-6m16 6 8-6" opacity=".7"/></svg>`,
    "tri-level": `<svg viewBox="0 0 120 70" aria-hidden="true"><path ${stroke} d="M6 40 34 26h24"/><path ${stroke} d="M10 38v26h48V40"/><path ${stroke} d="M58 30 84 12l30 16"/><path ${stroke} d="M58 30v34h52V28"/><path ${stroke} d="M58 46h52" opacity=".45"/><rect x="26" y="48" width="12" height="16" ${stroke}/></svg>`,
    "ceiling-open": `<svg viewBox="0 0 120 54" aria-hidden="true"><path ${stroke} d="M6 8h108"/>${[14,32,50,68,86,104].map((x) => `<path ${stroke} d="M${x} 8v26"/>`).join("")}<path ${stroke} d="M6 50h108" opacity=".35"/></svg>`,
    "ceiling-drop": `<svg viewBox="0 0 120 54" aria-hidden="true"><path ${stroke} d="M6 18h108M6 36h108" opacity=".9"/>${[6,34,62,90,114].map((x) => `<path ${stroke} d="M${x} 18v18"/>`).join("")}<path ${stroke} d="M66 22l18-10" opacity=".6"/></svg>`,
    "ceiling-finished": `<svg viewBox="0 0 120 54" aria-hidden="true"><path ${stroke} d="M6 14h108"/><path ${stroke} d="M52 14v4h16v-4" opacity=".6"/><path ${stroke} d="M6 50h108" opacity=".35"/></svg>`,
    "garage-house": garagePic(1), "garage-near": garagePic(2), "garage-far": garagePic(3),
  };
  function garagePic(which) {
    const dot = which === 1 ? [74, 34] : which === 2 ? [56, 12] : [16, 34];
    return `<svg viewBox="0 0 120 70" aria-hidden="true"><rect x="8" y="8" width="70" height="54" ${stroke}/><path ${stroke} d="M18 62h50" stroke-dasharray="4 5"/><rect x="78" y="8" width="34" height="54" ${stroke} opacity=".45"/><text x="95" y="38" font-size="9" text-anchor="middle" fill="currentColor" font-family="Inter, sans-serif">HOUSE</text><text x="43" y="56" font-size="8" text-anchor="middle" fill="currentColor" opacity=".6" font-family="Inter, sans-serif">garage door</text><rect x="${dot[0] - 5}" y="${dot[1] - 6}" width="10" height="12" rx="1.5" fill="#1688F8"/></svg>`;
  }
  const CHECK = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m4.8 8.2 2.2 2.2 4.2-4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // ---------- flow ----------
  const answered = (step) => step.kind === "distance" ? Boolean(answers.distanceMethod) : answers[step.key] !== undefined;
  function currentStep(steps) {
    if (cursor) { const s = steps.find((x) => x.key === cursor); if (s) return s; cursor = null; }
    return steps.find((s) => !answered(s)) || null;
  }

  function setAnswer(key, value) {
    const before = RW.routeWalkInferences(answers).map((i) => i.label + i.value);
    answers = RW.pruneRouteWalkAnswers({ ...answers, [key]: value });
    const after = RW.routeWalkInferences(answers);
    const fresh = after.filter((i) => !before.includes(i.label + i.value));
    lastHandled = fresh.length ? fresh[fresh.length - 1] : null;
    cursor = null;
    render();
    $("screen").scrollTop = 0;
  }

  function back(steps) {
    const cur = currentStep(steps);
    const idx = cur ? steps.indexOf(cur) : steps.length;
    if (idx > 0) { cursor = steps[idx - 1].key; lastHandled = null; render(); }
  }

  function bar(section, steps) {
    const reached = PROGRESS.indexOf(section === "Open spaces" ? "Your panel" : section);
    return `<div class="bar"><div class="bar-row"><button type="button" id="backBtn" ${steps.length && currentStep(steps) !== steps[0] ? "" : "hidden"}>← Back</button><b>${esc(section)}</b><span></span></div>
      <div class="progress" aria-hidden="true">${PROGRESS.map((_, i) => `<i class="${i <= reached ? "on" : ""}"></i>`).join("")}</div></div>`;
  }

  function handledStrip() {
    if (!lastHandled) return "";
    return `<div class="handled">${CHECK}<span><b>We’ll handle this:</b> ${esc(lastHandled.label)}: ${esc(lastHandled.value)}</span></div>`;
  }

  function renderChoice(step) {
    const pics = step.options.some((o) => o.picture);
    const current = answers[step.key];
    const opts = step.options.map((o, i) => {
      const unsure = o.value === "unsure";
      const wide = pics && (unsure || (step.options.length % 2 === 1 && i === step.options.length - 1 && !o.picture));
      return `<button type="button" class="opt${unsure ? " unsure" : ""}${wide ? " wide" : ""}" aria-pressed="${current === o.value}" data-value="${esc(o.value)}">
        ${o.picture ? `<span class="pic">${PICS[o.picture] || ""}</span>` : ""}<b>${esc(o.label)}</b>${o.detail ? `<small>${esc(o.detail)}</small>` : ""}</button>`;
    }).join("");
    return `<div class="q"><h2>${esc(step.prompt)}</h2>${step.help ? `<p class="help">${esc(step.help)}</p>` : ""}<div class="opts${pics ? " pics" : ""}">${opts}</div></div>`;
  }

  function walkPicture() {
    return `<div class="walk" aria-hidden="true"><svg viewBox="0 0 320 120">
      <rect x="6" y="6" width="308" height="108" rx="8" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/>
      <path d="M110 6v46M110 78v36M210 6v70M210 100v14" stroke="currentColor" stroke-width="2" opacity=".35"/>
      <rect x="18" y="20" width="16" height="22" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><text x="26" y="58" font-size="10" text-anchor="middle" fill="currentColor" font-family="Inter, sans-serif">panel</text>
      <path d="M36 34h40q20 0 20 20v12q0 10 14 10h70q16 0 16 12v0h56" fill="none" stroke="#1688F8" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
      <rect x="282" y="80" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><text x="289" y="112" font-size="10" text-anchor="middle" fill="currentColor" font-family="Inter, sans-serif">outlet</text>
      <text x="160" y="70" font-size="10" text-anchor="middle" fill="#1688F8" font-family="Inter, sans-serif">walk it like a person would</text>
    </svg></div>`;
  }

  function draftFeet() {
    if (draft.method === "feet") { const n = Number(draft.feet); return n > 0 ? Math.ceil(n) : null; }
    if (draft.method === "steps") { const n = Number(draft.steps); return Number.isInteger(n) && n > 0 ? Math.ceil(n * RW.RW_FEET_PER_STEP) : null; }
    return null;
  }

  function renderDistance(step) {
    const valid = draft.method === "estimate" ? Boolean(draft.estimate) : draftFeet() !== null;
    const method = (m, label) => `<button type="button" data-method="${m}" aria-pressed="${draft.method === m}">${label}</button>`;
    let body = "";
    if (draft.method === "feet") body = `<label class="field" for="feetIn">Distance in feet<input id="feetIn" inputmode="decimal" type="number" min="1" step="1" placeholder="e.g. 35" value="${esc(draft.feet)}"></label><p class="help">A tape measure works best. A phone measuring app is fine too.</p>`;
    if (draft.method === "steps") body = `<label class="field" for="stepsIn">Number of normal walking steps<input id="stepsIn" inputmode="numeric" type="number" min="1" step="1" placeholder="e.g. 14" value="${esc(draft.steps)}"></label><p class="convert" id="conv">${draftFeet() ? `≈ ${draftFeet()} ft (we count ${RW.RW_FEET_PER_STEP} ft per step and round up)` : `We’ll convert steps to feet for you.`}</p>`;
    if (draft.method === "estimate") body = `<div class="opts">${[["near", "Same room or the next room over"], ["across", "Across the house"], ["far", "The far end of a large house"]].map(([v, l]) => `<button type="button" class="opt" data-estimate="${v}" aria-pressed="${draft.estimate === v}"><b>${l}</b></button>`).join("")}</div><p class="note">An estimate is priced at the top of its range. Measuring usually gives a lower price.</p>`;
    return `<div class="q"><h2>${esc(step.prompt)}</h2><p class="help">${esc(step.help)}</p>${walkPicture()}
      <div class="seg" role="group" aria-label="How will you measure?">${method("feet", "Tape measure")}${method("steps", "Count steps")}${method("estimate", "I can’t measure")}</div>
      ${body}<button type="button" class="cta" id="distanceGo" ${valid ? "" : "disabled"}>Continue</button></div>`;
  }

  function renderAck() {
    const r = RW.routeWalkToDedicatedAnswers({ ...answers, finishAck: "accepted" });
    const facts = r.facts;
    const steps = RW.routeWalkSteps(answers);
    const keyFor = (label) => (steps.find((s) => s.prompt === label) || { key: "distanceMethod" }).key;
    return `<div class="q"><h2>Here’s what we’ll do</h2><p class="help">Check the left side. We worked out the right side from it.</p>
      <div class="split">
        <section><h3 class="you">You told us</h3><dl>${facts.map((f) => `<div><dt>${esc(f.label)}</dt><dd><span>${esc(f.value)}</span><button type="button" data-edit="${keyFor(f.label)}">Change</button></dd></div>`).join("")}</dl></section>
        <section><h3 class="we">We figured out</h3><dl>${r.inferred.map((i) => `<div><dt>${esc(i.label)}</dt><dd><span>${esc(i.value)}<small>${esc(i.basis)}</small></span></dd></div>`).join("")}</dl></section>
      </div>
      ${answers.exterior === "yes" || answers.exterior === "unsure" ? `<p class="note warn">Even with attic, basement or crawl space access, we can’t always run wire inside an outside wall. If we need to come through finished drywall instead, we’ll show you any added price before we start. Patching and painting aren’t included.</p>` : ""}
      ${answers.wall === "unsure" ? `<p class="note warn">You weren’t sure what the wall is made of, so we priced ordinary drywall. If it turns out to be plaster, brick or concrete, the electrician will show you any added price before starting.</p>` : ""}
      <p class="note">If we need small openings in finished walls or ceilings, we keep the removed pieces and put them back in place. Patching and painting aren’t included.</p>
      <button type="button" class="cta" id="ackGo">Looks right — show my price</button></div>`;
  }

  function renderResult(r) {
    if (r.kind === "REVIEW") {
      return `<div class="result"><span class="badge rev">We’ll confirm this one</span><h2>${r.code === "RISER_NOT_MODELLED" ? "Your wire has to climb between floors" : "We need a quick look"}</h2>
        <p>${esc(r.reason)}</p><p class="help">Nothing you answered was wrong. Your answers are saved, and an electrician will reply with a fixed price, usually the same day.</p>
        <button type="button" class="cta" id="photosGo">Add 2 photos to speed this up</button><button type="button" class="ghost" id="changeGo">Change an answer</button></div>`;
    }
    const p = RW.routeWalkEnginePreview(r.answers);
    return `<div class="result"><span class="badge ok">Ready to price</span><h2>Your price is ready</h2>
      <p>We priced a ${p.routeFeet}-foot ${p.access === "accessible" ? "open-access" : "finished-wall"} route${p.floorTransitions ? ` with ${p.floorTransitions} floor change${p.floorTransitions === 1 ? "" : "s"}` : ""}.</p>
      <p class="note">Prototype: the price itself comes from the contractor’s approved rates in the live engine. The panel on the right shows exactly what this flow hands it.</p>
      <button type="button" class="ghost" id="changeGo">Change an answer</button></div>`;
  }

  // ---------- inspector ----------
  function renderInspector(r) {
    const status = r.kind === "PRICE_INPUTS" ? `<span class="badge ok">Ready to price</span>` : r.kind === "REVIEW" ? `<span class="badge rev">Review · ${esc(r.code)}</span>` : `<span class="badge wip">Collecting answers</span>`;
    const facts = r.facts.length ? `<ul>${r.facts.map((f) => `<li>${esc(f.value)}<span>${esc(f.label)}</span></li>`).join("")}</ul>` : `<p class="empty">Nothing yet.</p>`;
    const inferred = r.inferred.length ? `<ul>${r.inferred.map((i) => `<li>${esc(i.label)}: ${esc(i.value)}<span>${esc(i.basis)}</span></li>`).join("")}</ul>` : `<p class="empty">Inferences appear as the customer answers.</p>`;
    let engine = `<p class="empty">The answer keys for the existing dedicated-circuit package appear once the route is complete.</p>`;
    if (r.kind === "REVIEW") engine = `<p class="note warn">${esc(r.reason)}</p><p class="empty">Nothing is sent to instant pricing. ${r.code === "RISER_NOT_MODELLED" ? "The existing engine would count fewer floor changes than this route needs, so pricing it would undercharge." : ""}</p>`;
    if (r.kind === "PRICE_INPUTS") {
      const p = RW.routeWalkEnginePreview(r.answers);
      const garage = RW.garageCrossingFeet(answers);
      engine = `<div class="sum"><div><b>${p.routeFeet} ft</b><span>route feet</span></div><div><b>${p.floorTransitions}</b><span>floor changes (1 h each)</span></div><div><b>${p.verticalOpenings}</b><span>vertical wall openings</span></div><div><b>${p.access === "accessible" ? "Open" : "Concealed"}</b><span>route access</span></div></div>
        <p class="math">${p.bandCeiling ? `band ceiling (contractor’s ${r.answers.dedicated_distance} breakpoint)` : `${p.measuredFeet - garage} walked`}${garage ? ` + ${garage} garage` : ""}${p.doorwayFeet ? ` + ${p.doorwayFeet} doorways` : ""}${p.verticalFeet ? ` + ${p.verticalFeet} vertical` : ""} = ${p.routeFeet} ft</p>
        ${r.flags.length ? `<div class="flags">${r.flags.map((f) => `<code>${esc(f)}</code>`).join("")}</div>` : ""}
        <div class="keys"><table><tbody>${Object.entries(r.answers).sort().map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</tbody></table></div>`;
    }
    $("inspector").innerHTML = `<details open><summary>Behind the scenes ${status}</summary><div class="body">
      <div class="cols"><div class="col you"><h4>Customer supplied</h4>${facts}</div><div class="col we"><h4>Software inferred</h4>${inferred}</div></div>
      <div><h4 style="margin:0 0 8px;font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)">Existing pricing engine receives</h4>${engine}</div>
    </div></details>`;
  }

  // ---------- render ----------
  let showResult = false;
  function render() {
    const steps = RW.routeWalkSteps(answers);
    const r = RW.routeWalkToDedicatedAnswers(answers);
    renderInspector(r);
    const step = currentStep(steps);
    let html;
    if (r.kind === "REVIEW" && !cursor) html = bar("Check and confirm", steps) + renderResult(r);
    else if (showResult && !step) html = bar("Check and confirm", steps) + renderResult(r);
    else if (!step) html = bar("Check and confirm", steps) + renderAck();
    else html = bar(step.section, steps) + handledStrip() + (step.kind === "distance" ? renderDistance(step) : step.kind === "ack" ? renderAck() : renderChoice(step));
    $("screen").innerHTML = html;
    wire(step, steps);
  }

  function wire(step, steps) {
    const b = $("backBtn"); if (b) b.onclick = () => { showResult = false; back(steps); };
    document.querySelectorAll(".opt[data-value]").forEach((el) => el.onclick = () => {
      if (step.key === "estimateAck" && el.dataset.value === "measure") {
        const { distanceMethod, distanceEstimate, estimateAck, ...rest } = answers;
        answers = rest; draft.method = "feet"; cursor = null; lastHandled = null; render(); return;
      }
      setAnswer(step.key, el.dataset.value);
    });
    document.querySelectorAll("[data-method]").forEach((el) => el.onclick = () => { draft.method = el.dataset.method; render(); });
    document.querySelectorAll("[data-estimate]").forEach((el) => el.onclick = () => { draft.estimate = el.dataset.estimate; render(); });
    const f = $("feetIn"); if (f) f.oninput = () => { draft.feet = f.value; $("distanceGo").disabled = draftFeet() === null; };
    const s = $("stepsIn"); if (s) s.oninput = () => { draft.steps = s.value; const ft = draftFeet(); $("distanceGo").disabled = ft === null; $("conv").textContent = ft ? `≈ ${ft} ft (we count ${RW.RW_FEET_PER_STEP} ft per step and round up)` : "We’ll convert steps to feet for you."; };
    const go = $("distanceGo"); if (go) go.onclick = () => {
      answers = { ...answers, distanceFeet: draft.method === "feet" ? draft.feet : undefined, distanceSteps: draft.method === "steps" ? draft.steps : undefined, distanceEstimate: draft.method === "estimate" ? draft.estimate : undefined };
      setAnswer("distanceMethod", draft.method);
    };
    const ack = $("ackGo"); if (ack) ack.onclick = () => { answers = { ...answers, finishAck: "accepted" }; showResult = true; cursor = null; render(); };
    document.querySelectorAll("[data-edit]").forEach((el) => el.onclick = () => { cursor = el.dataset.edit; showResult = false; lastHandled = null; render(); });
    const change = $("changeGo"); if (change) change.onclick = () => { showResult = false; const st = RW.routeWalkSteps(answers); cursor = (st[st.length - 1] || {}).key || null; if (answers.finishAck) { const { finishAck, ...rest } = answers; answers = rest; } render(); };
    const photos = $("photosGo"); if (photos) photos.onclick = () => { photos.textContent = "Photo upload isn’t part of this prototype"; photos.disabled = true; };
  }

  document.querySelectorAll("[data-example]").forEach((el) => el.onclick = () => {
    answers = { ...EXAMPLES[el.dataset.example] };
    draft = { ...(DRAFT_EXAMPLES[el.dataset.example] || { method: "feet", feet: "", steps: "", estimate: "" }) };
    cursor = null; showResult = false; lastHandled = null; render();
  });

  render();
})();
</script>
