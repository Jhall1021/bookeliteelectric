name: Diagnose build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://diagnostic:diagnostic@127.0.0.1:5432/diagnostic
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Strict TypeScript compile
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Diagnostic compile past implicit-any blocker
        run: npx tsc --noEmit --noImplicitAny false
      - name: Fast verifier
        run: npm run verify:fast
